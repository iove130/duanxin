name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip curl ca-certificates \
            openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config cmake ccache patch \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install buildozer
        run: pip install --upgrade "buildozer>=1.5" "cython<3" virtualenv

      # SDK/NDK/p4a 编译产物缓存：二次构建可从 30+ 分钟降到 ~10 分钟
      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache project build dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ github.sha }}
          restore-keys: buildozer-local-

      - name: Build APK with Buildozer
        run: buildozer -v android debug
        env:
          CI: "false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-apk
          path: bin/*.apk

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
