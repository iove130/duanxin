name: Build Kotlin APK

on:
  push:
    branches: [kotlin]
    paths:
      - 'sms-forwarder-kotlin/**'
      - '.github/workflows/build-kotlin-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        working-directory: sms-forwarder-kotlin
        run: chmod +x gradlew

      - name: Run unit tests (rule engine)
        working-directory: sms-forwarder-kotlin
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: sms-forwarder-kotlin
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-kotlin-apk
          path: sms-forwarder-kotlin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
